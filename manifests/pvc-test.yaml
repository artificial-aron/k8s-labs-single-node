# Stage 5 gate: verify local-path dynamic provisioning
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-pvc
  namespace: default
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: test-pv-pod
  namespace: default
spec:
  containers:
    - name: c
      image: busybox
      command: ["sh", "-c", "echo hello-pv > /data/f && sleep 3600"]
      volumeMounts:
        - name: v
          mountPath: /data
  volumes:
    - name: v
      persistentVolumeClaim:
        claimName: test-pvc
